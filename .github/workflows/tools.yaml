name: tools
on: [push, workflow_dispatch]
jobs:
  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: pip install pyyaml==6.0.3 pytest==8.4.2   # the versions in the local .venv
      - name: Generated files are up to date
        run: python tools/gen_isa.py --check
      - name: Tool tests
        run: pytest -q
  formal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # Pinned to the OSS CAD Suite release the proofs were developed and timed with
      # (formal/README.md "Results"); the nightly default could move sby/yosys/boolector/yices
      # under the prove tasks' `timeout 420`.
      - uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          version: '2026-09-15'
      - run: cd formal && sby -f core.sby
