# Protocol emulator ISA v0. Single source of truth: tools/gen_isa.py generates
# tools/isa_defs.py, src/isa_defs.vh and docs/isa.md from this file.
name: pe-isa
version: 0
word_bits: 16
pc_bits: 10
registers: {R0: 0, R1: 1, R2: 2, R3: 3, R4: 4, R5: 5, R6: 6, R7: 7}   # R0 reads as zero
flags: {RXV: 0, TXE: 1, TO: 2}          # flag ids for WAITF / BFLAG
banks_out: {UO: 0, UIO: 1}              # pin write banks (OE always targets uio_oe)
banks_in:  {UI: 0, UIO: 1, UOR: 2, UIOR: 3}   # IN sources: ui_in, uio_in, uo_out readback, uio_out readback
alu_fn: {MOV: 0, ADD: 1, SUB: 2, AND: 3, OR: 4, XOR: 5, SHL: 6, SHR: 7, ROR: 8, CMP: 9, BITT: 10}
br_cond: {BZ: 0, BNZ: 1, BC: 2, BNC: 3, BTO: 4, BNTO: 5}
waitp_cond: {LOW: 0, HIGH: 1, RISE: 2, FALL: 3}
pin_op: {SET: 0, CLR: 1, TGL: 2, OE: 3}
wait_sub: {WAITT: 0, DELAY: 1, WAITP: 2, WAITF: 3, WAITL: 4}
time_op: {SETT: 0, ADDT: 1}
classes:                                # bits [15:12]
  MISC: 0
  LDI: 1
  ALU: 2
  ADDI: 3
  PIN: 4
  SETR: 5
  IN: 6
  WAIT: 7
  TIME: 8
  BR: 9
  JMP: 10
  BPIN: 11
  BFLAG: 12
  LANE: 13     # reserved, executes as NOP in v0
  HOST: 14
  RSV: 15      # reserved, executes as NOP
# Field layouts: name -> [msb, lsb]; "signed" fields are two's complement.
layouts:
  MISC:  {sub: [11, 0]}
  LDI:   {rd: [11, 9], hi: [8, 8], imm8: [7, 0]}
  ALU:   {rd: [11, 9], rs: [8, 6], fn: [5, 2]}
  ADDI:  {rd: [11, 9], simm9: [8, 0]}
  PIN:   {op: [11, 10], bank: [9, 8], mask: [7, 0]}
  SETR:  {rn: [11, 9], bank: [8, 8], pin: [7, 5], bit: [3, 0]}
  IN:    {rd: [11, 9], bank: [8, 7]}
  WAIT:  {sub: [11, 9], rn: [8, 6], imm9: [8, 0], rt: [8, 6], bank: [5, 5], pin: [4, 2], cond: [1, 0], flag: [5, 0], lane: [1, 0]}
  TIME:  {rd: [11, 9], op: [8, 8], imm8: [7, 0]}
  BR:    {cond: [11, 9], simm9: [8, 0]}
  JMP:   {call: [11, 11], target: [9, 0]}
  BPIN:  {level: [11, 11], bank: [10, 10], pin: [9, 7], simm7: [6, 0]}
  BFLAG: {level: [11, 11], flag: [10, 6], simm6: [5, 0]}
  HOST:  {r: [11, 9], pop: [8, 8]}
misc_sub: {NOP: 0, HALT: 1, RET: 2, IRQ: 3}
# Mnemonic table: operands are field names in order; fixed fields are set.
mnemonics:
  NOP:   {class: MISC, fixed: {sub: 0}, operands: []}
  HALT:  {class: MISC, fixed: {sub: 1}, operands: []}
  RET:   {class: MISC, fixed: {sub: 2}, operands: []}
  IRQ:   {class: MISC, fixed: {sub: 3}, operands: []}
  LDI:   {class: LDI, fixed: {hi: 0}, operands: [rd, imm8]}
  LDIH:  {class: LDI, fixed: {hi: 1}, operands: [rd, imm8]}
  MOV:   {class: ALU, fixed: {fn: 0}, operands: [rd, rs]}
  ADD:   {class: ALU, fixed: {fn: 1}, operands: [rd, rs]}
  SUB:   {class: ALU, fixed: {fn: 2}, operands: [rd, rs]}
  AND:   {class: ALU, fixed: {fn: 3}, operands: [rd, rs]}
  OR:    {class: ALU, fixed: {fn: 4}, operands: [rd, rs]}
  XOR:   {class: ALU, fixed: {fn: 5}, operands: [rd, rs]}
  SHL:   {class: ALU, fixed: {fn: 6, rs: 0}, operands: [rd]}
  SHR:   {class: ALU, fixed: {fn: 7, rs: 0}, operands: [rd]}
  ROR:   {class: ALU, fixed: {fn: 8, rs: 0}, operands: [rd]}
  CMP:   {class: ALU, fixed: {fn: 9}, operands: [rd, rs]}
  BITT:  {class: ALU, fixed: {fn: 10}, operands: [rd, rs]}
  ADDI:  {class: ADDI, fixed: {}, operands: [rd, simm9]}
  SET:   {class: PIN, fixed: {op: 0}, operands: [bank, mask]}
  CLR:   {class: PIN, fixed: {op: 1}, operands: [bank, mask]}
  TGL:   {class: PIN, fixed: {op: 2}, operands: [bank, mask]}
  OE:    {class: PIN, fixed: {op: 3}, operands: [bank, mask]}     # bank field = value (0 clear, 1 set) for OE
  SETR:  {class: SETR, fixed: {}, operands: [bank, pin, rn, bit]}
  IN:    {class: IN, fixed: {}, operands: [rd, bank]}
  WAITT: {class: WAIT, fixed: {sub: 0}, operands: [rn]}
  DELAY: {class: WAIT, fixed: {sub: 1}, operands: [imm9]}
  WAITP: {class: WAIT, fixed: {sub: 2}, operands: [bank, pin, cond, rt]}
  WAITF: {class: WAIT, fixed: {sub: 3}, operands: [flag, rt]}
  SETT:  {class: TIME, fixed: {op: 0}, operands: [rd, imm8]}
  ADDT:  {class: TIME, fixed: {op: 1}, operands: [rd, imm8]}
  BZ:    {class: BR, fixed: {cond: 0}, operands: [simm9]}
  BNZ:   {class: BR, fixed: {cond: 1}, operands: [simm9]}
  BC:    {class: BR, fixed: {cond: 2}, operands: [simm9]}
  BNC:   {class: BR, fixed: {cond: 3}, operands: [simm9]}
  BTO:   {class: BR, fixed: {cond: 4}, operands: [simm9]}
  BNTO:  {class: BR, fixed: {cond: 5}, operands: [simm9]}
  JMP:   {class: JMP, fixed: {call: 0}, operands: [target]}
  CALL:  {class: JMP, fixed: {call: 1}, operands: [target]}
  BPIN:  {class: BPIN, fixed: {}, operands: [bank, pin, level, simm7]}
  BFLAG: {class: BFLAG, fixed: {}, operands: [flag, level, simm6]}
  PUSH:  {class: HOST, fixed: {pop: 0}, operands: [r]}
  POP:   {class: HOST, fixed: {pop: 1}, operands: [r]}
semantics:
  timing: "Every instruction takes exactly one cycle except the WAIT class. Branches, JMP, CALL and RET have one delay slot: the following instruction always executes. Pin output registers written by PIN/SETR update on the clock edge that ends the executing cycle, so the new level is visible from the next cycle."
  branches: "Relative targets are pc + 1 + simm (pc = address of the branch). JMP/CALL targets are absolute 10-bit. CALL pushes pc + 2 (the address after the delay slot) onto a 4-entry stack; RET pops it."
  waits: "WAITT Rn stalls until T == Rn (exact). DELAY n stalls n cycles then completes (n+1 cycles total). WAITP/WAITF/WAITL take a timeout register Rt in ticks of T; Rt = R0 means 65535. On timeout the wait completes and TO = 1, otherwise TO = 0."
  flags: "ADD/SUB/CMP/ADDI set Z and C (C = carry out of the 16-bit add, or 'no borrow' for SUB/CMP). AND/OR/XOR/MOV/LDI/SHL/SHR/ROR set Z only; SHL/SHR/ROR also set C to the bit shifted out. BITT sets Z = ((rd & rs) == 0) and writes nothing."
  pins: "SET/CLR/TGL apply mask to the bank's output register. OE bank,mask: bank=1 sets uio_oe bits in mask, bank=0 clears them. SETR bank,pin,rn,bit sets output pin to bit 'bit' of Rn. IN Rd,bank reads the synchronised input bank (2-cycle sampling latency) or an output register."
  reset: "PC = 0, all registers 0, flags 0, T = 0, uio_oe = 0, outputs 0, core halted until RUN."
  run: "The core samples RUN through one register: it becomes active the cycle after RUN rises (with the first instruction at PC executing in that cycle) and inactive the cycle after RUN falls. core_reset takes effect immediately and suppresses all side effects in its cycle."
